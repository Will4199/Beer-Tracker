<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Units</title>
  <meta name="description" content="Quickly log beer, red wine and Prosecco and see your alcohol units by day, week and month.">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Units">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#log" data-tab="log" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      <span>Log</span>
    </a>
    <a href="#history" data-tab="history" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      <span>History</span>
    </a>
    <a href="#charts" data-tab="charts" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span>Charts</span>
    </a>
    <a href="#settings" data-tab="settings" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="sheet-root"></div>

  <script src="app.js"></script>
</body>
</html>
